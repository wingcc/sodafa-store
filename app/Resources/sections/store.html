<div class="dark-band store-band" id="storeBand">
     <div class="deco d1"></div>
     <div class="deco d2"></div>
     <div class="pat"></div>
     <div class="wrap store-grid">
          <div class="rv">
               <span class="store-badge"><i></i>📍 عندنا محل حقيقي</span>
               <h2>تفضّلي زورينا</h2>
               <p class="desc">أهلاً وسهلاً بكل وحدة بغات تزورنا 🌿 بابنا مفتوح ليك. بغيتي تشوفي المنتج بعينيك قبل
                    ما تشري؟ مرحبا بك في صودفا — عنوان حقيقي وثقة كاملة.</p>
               <div class="cinfo">
                    <span class="icb"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                              <circle cx="12" cy="10" r="3" />
                         </svg></span>
                    <div><b>العنوان</b><span data-t="address"></span></div>
               </div>
               <div class="cinfo">
                    <span class="icb wa"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                              <path
                                   d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.2 14.2c-.2.6-1.2 1.2-1.7 1.2-.4.1-1 .1-1.6-.1a13 13 0 0 1-5.9-5.2c-.6-1-.9-2-.6-2.6.2-.5.8-1.4 1.3-1.5.4 0 .7 0 .9.5l.7 1.6c.1.3 0 .6-.2.8l-.5.6c-.2.2-.2.4-.1.7.5.9 2 2.4 3.2 2.9.3.1.5.1.7-.1l.7-.8c.2-.3.5-.3.8-.2l1.7.8c.4.2.6.4.6.6 0 .2 0 .5-.1.8Z" />
                         </svg></span>
                    <div><b>الهاتف / واتساب</b><a class="gold" data-href="waStore" target="_blank" rel="noopener"
                              dir="ltr" data-t="phoneDisplay"></a></div>
               </div>
               <div class="cinfo">
                    <span class="icb"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                              <circle cx="12" cy="12" r="9" />
                              <path d="M12 7v5l3.5 2" />
                         </svg></span>
                    <div><b>أوقات العمل</b><span data-t="hoursStore"></span></div>
               </div>
               <div class="store-btns">
                    <a class="btn btn-gold" data-href="maps" target="_blank" rel="noopener">
                         <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                              stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                              <circle cx="12" cy="10" r="3" />
                         </svg>
                         احصلي على الاتجاهات
                    </a>
                    <button class="btn btn-ghost-light" data-open-contact>
                         <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                              <path
                                   d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                         </svg>
                         تواصلي معنا
                    </button>
               </div>
          </div>
          <div class="map-wrap rv" data-d="150">
               <div class="map-glow"></div>
               <div class="map-frame">
                    <iframe id="mapFrame" title="موقع صودفا" loading="lazy" allowfullscreen></iframe>
                    <div class="map-tag">
                         <span class="mt-r"><span class="dot"></span>📍 الموقع الحقيقي</span>
                         <b data-t="addressShort"></b>
                    </div>
               </div>
          </div>
     </div>
</div>
