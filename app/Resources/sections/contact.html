<!-- ═══════════════════════════════════════════════════════════════
     FILE: sections/contact.html
     قسم التواصل — مستوحى من التصميم الجديد (ContactSection)
     ═══════════════════════════════════════════════════════════════ -->
<section id="contact" class="contact-section">
     <div class="wrap">
          <div class="sec-head rv">
               <span class="eyebrow">تواصلي معنا</span>
               <h2>نحن هنا لمساعدتك</h2>
               <p>لا تترددي في الاتصال بنا — فريقنا جاهز للرد على استفساراتك</p>
          </div>

          <div class="contact-grid rv" data-d="120">
               <!-- نموذج التواصل -->
               <div class="contact-form-card">
                    <h3>أرسلي لنا رسالة</h3>
                    <form id="contactForm" novalidate>
                         <div class="f-row">
                              <div class="f-field">
                                   <label for="ctName">الاسم الكامل</label>
                                   <input type="text" id="ctName" name="name" placeholder="أدخلي اسمك الكامل" required>
                              </div>
                              <div class="f-field">
                                   <label for="ctPhone">رقم الهاتف</label>
                                   <input type="tel" id="ctPhone" name="phone" placeholder="+212 6XX XXX XXX" required>
                              </div>
                         </div>
                         <div class="f-field">
                              <label for="ctEmail">البريد الإلكتروني</label>
                              <input type="email" id="ctEmail" name="email" placeholder="example@email.com" required>
                         </div>
                         <div class="f-field">
                              <label for="ctMsg">الرسالة</label>
                              <textarea id="ctMsg" name="message" rows="5" placeholder="اكتبي رسالتك هنا..."
                                   required></textarea>
                         </div>
                         <button type="submit" class="btn btn-main contact-send" id="ctSend">
                              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                   stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                   <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
                              </svg>
                              إرسال الرسالة
                         </button>
                    </form>
               </div>

               <!-- معلومات التواصل -->
               <div class="contact-info-side">
                    <div class="contact-info-card">
                         <h3>معلومات التواصل</h3>
                         <div class="cinfo">
                              <span class="icb"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <path
                                             d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                                   </svg></span>
                              <div><b>الهاتف</b><a class="gold" data-href="tel" dir="ltr" data-t="phoneDisplay">+212 626
                                        03 84 07</a>
                              </div>
                         </div>
                         <div class="cinfo">
                              <span class="icb"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <path
                                             d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                                   </svg></span>
                              <div><b>البريد الإلكتروني</b><a class="gold" data-href="mail" dir="ltr"
                                        data-t="email">info@sodfa.com</a>
                              </div>
                         </div>
                         <div class="cinfo">
                              <span class="icb"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                                        <circle cx="12" cy="10" r="3" />
                                   </svg></span>
                              <div><b>العنوان</b><span data-t="address">حي البساتين، مكناس، المغرب</span></div>
                         </div>
                         <div class="cinfo">
                              <span class="icb"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <circle cx="12" cy="12" r="9" />
                                        <path d="M12 7v5l3.5 2" />
                                   </svg></span>
                              <div><b>ساعات العمل</b><span data-t="hoursContact">السبت - الخميس: 9:00 ص - 6:00 م</span>
                              </div>
                         </div>
                    </div>

                    <div class="contact-social-card">
                         <h3>تابعينا على</h3>
                         <div class="social-row" data-page="socialIcons">
                              <a data-href="instagram" target="_blank" rel="noopener" aria-label="Instagram"><svg
                                        width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2">
                                        <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" />
                                        <circle cx="12" cy="12" r="4.2" />
                                        <circle cx="17.5" cy="6.5" r="1.3" fill="currentColor" stroke="none" />
                                   </svg></a>
                              <a data-href="facebook" target="_blank" rel="noopener" aria-label="Facebook"><svg
                                        width="19" height="19" viewBox="0 0 24 24" fill="currentColor">
                                        <path
                                             d="M13.5 22v-8h2.7l.4-3.1h-3.1V8.9c0-.9.25-1.5 1.55-1.5h1.65V4.6c-.3-.04-1.3-.13-2.4-.13-2.4 0-4 1.46-4 4.13v2.3H7.6V14h2.7v8h3.2z" />
                                   </svg></a>
                              <a data-href="tiktok" target="_blank" rel="noopener" aria-label="TikTok"><svg width="19"
                                        height="19" viewBox="0 0 24 24" fill="currentColor">
                                        <path
                                             d="M16.6 3c.4 2 1.7 3.4 3.9 3.6v2.9c-1.5 0-2.8-.4-3.9-1.2v5.6c0 3.9-2.7 6.1-5.7 6.1-3.2 0-5.9-2.3-5.9-5.7 0-3.6 3.1-6 6.5-5.6v3c-1.7-.4-3.4.6-3.4 2.5 0 1.6 1.2 2.8 2.8 2.8 1.6 0 2.8-1.1 2.8-3V3h2.9z" />
                                   </svg></a>
                         </div>
                    </div>

                    <a class="btn btn-wa contact-wa-btn" data-href="waStore" target="_blank" rel="noopener">
                         <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor">
                              <path
                                   d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.2 14.2c-.2.6-1.2 1.2-1.7 1.2-.4.1-1 .1-1.6-.1a13 13 0 0 1-5.9-5.2c-.6-1-.9-2-.6-2.6.2-.5.8-1.4 1.3-1.5.4 0 .7 0 .9.5l.7 1.6c.1.3 0 .6-.2.8l-.5.6c-.2.2-.2.4-.1.7.5.9 2 2.4 3.2 2.9.3.1.5.1.7-.1l.7-.8c.2-.3.5-.3.8-.2l1.7.8c.4.2.6.4.6.6 0 .2 0 .5-.1.8Z" />
                         </svg>
                         تواصلي معنا عبر واتساب
                    </a>
               </div>
          </div>
     </div>
</section>
